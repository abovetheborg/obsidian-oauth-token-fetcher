name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Attest release build
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js

      - name: Verify tag matches manifest version
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./manifest.json').version")"

      # Obsidian requires the tag to equal manifest.json's version, with no "v" prefix.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "$GITHUB_REF_NAME" --generate-notes
